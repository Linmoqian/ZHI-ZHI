name: Release 桌面构建

# 触发：手工（workflow_dispatch）+ 推送版本标签（v*）。
# 仅从受保护 main 发行（见 docs/development/github.md 发行与回滚）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 允许上传 Release 附件（workflow_dispatch 手工验证用）

jobs:
  test:
    name: 测试（前端 + 后端）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安装依赖（锁文件）
        working-directory: app
        run: npm ci

      - name: 前端 Vitest
        working-directory: app
        run: npm test

      - name: 后端 Server 测试
        working-directory: app
        run: npm run server:test

  build:
    name: 构建 ${{ matrix.platform }}（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            artifact: dmg
          - os: windows-latest
            platform: Windows
            artifact: nsis
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安装依赖（锁文件）
        working-directory: app
        run: npm ci

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: 安装 Windows 系统依赖（WebView2 引导）
        if: matrix.os == 'windows-latest'
        run: |
          echo "Windows 需在安装时引导 WebView2 bootstrapper；此处由 tauri 构建处理。"

      - name: 构建安装包（beforeBuildCommand 内完成 sidecar + server + 前端）
        working-directory: app
        run: npm run tauri build

      - name: 收集 Windows 安装包
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          if (-not (Test-Path $dir)) { $dir = "src-tauri/target/release/bundle/msi" }
          Get-ChildItem $dir | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: zhiZhi-${{ matrix.platform }}-${{ github.ref_name }}
          path: |
            app/src-tauri/target/release/bundle/macos/*.dmg
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi

  release:
    name: 发布 Release（tag 触发）
    # 仅 push 版本标签时创建正式 Release，从受保护 main。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ${{ github.ref_name }} demo 版本：让知识生长

            知枝是一款可分支、可回溯的 AI 学习助手。
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
